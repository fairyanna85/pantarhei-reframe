<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="274" viewBox="0 0 1200 274" role="img" aria-label="The Lens Rotation: a sample output of Panta Rhei reframe">
<rect width="1200" height="274" rx="14" fill="#14161A"/>
<circle cx="34" cy="34" r="6" fill="#7FA2F0"/><text x="52" y="39" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#A9B0BC" letter-spacing="1">THE LENS ROTATION</text>
<text x="40" y="82" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">v0  &quot;My team keeps missing deadlines and I&#x27;m exhausted.&quot;</text>
<text x="40" y="104" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#7FA2F0" xml:space="preserve">──────────────────────────────────────────────────────────────</text>
<text x="40" y="126" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">Iceberg (systems thinking)        → The misses are a pattern; what structure produces them?</text>
<text x="40" y="148" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">Whose problem? (Gause &amp; Weinberg) → Who set the deadlines, and do they experience the misses as a problem?</text>
<text x="40" y="170" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">Polarity (Johnson)                → Speed vs. quality is being treated as solvable; it is a tension to manage.</text>
<text x="40" y="192" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">Control map (Epictetus; Covey)    → I control scope and staffing requests; I do not control the launch date.</text>
<text x="40" y="214" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">Ferriss questions                 → What would this look like if delivery were easy?</text>
</svg>